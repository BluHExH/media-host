<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Media Host">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="160" fill="#2563eb" opacity="0.18"/>
  <circle cx="1050" cy="520" r="200" fill="#7c3aed" opacity="0.16"/>
  <circle cx="900" cy="100" r="100" fill="#38bdf8" opacity="0.12"/>
  <g filter="url(#soft)" transform="translate(720,140) rotate(-12)">
    <rect width="200" height="140" rx="18" fill="url(#card1)"/>
    <text x="100" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">IMG</text>
  </g>
  <g filter="url(#soft)" transform="translate(880,200) rotate(8)">
    <rect width="210" height="150" rx="18" fill="url(#card2)"/>
    <circle cx="105" cy="80" r="22" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <polygon points="98,68 98,92 118,80" fill="#60a5fa"/>
    <text x="105" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">video.mp4</text>
  </g>
  <g filter="url(#soft)" transform="translate(780,320) rotate(-6)">
    <rect width="160" height="110" rx="16" fill="url(#card3)"/>
    <text x="80" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#86198f">HTML</text>
  </g>
  <g filter="url(#glow)">
    <rect x="96" y="230" width="100" height="100" rx="24" fill="url(#g)"/>
  </g>
  <text x="146" y="298" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="42" font-weight="700" fill="#ffffff">MH</text>
  <text x="220" y="275" font-family="system-ui,Segoe UI,sans-serif" font-size="58" font-weight="700" fill="#f8fafc">Media Host</text>
  <text x="222" y="318" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Private CDN · Images · Video · Audio · HTML</text>
  <text x="222" y="360" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#64748b">Secure uploads · Folders · Instant public links</text>
</svg>
